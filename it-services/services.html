<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Services | Very Boring Technologies</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="subpage">

  <div id="top-bar" class="top-bar"></div>

  <!-- Navigation -->
  <nav>
    <div class="container">
      <div class="nav-content" id="nav-content"></div>
    </div>
  </nav>

  <header class="subpage-header section-dark">
    <div class="container">
      <h1 id="page-title">Loading Services...</h1>
      <p id="page-intro" class="hero-text"></p>
    </div>
  </header>

  <main id="services-detailed" class="container">
    <!-- Content will be injected here -->
  </main>
  <section id="contact" class="section-accent"></section>

  <footer id="footer"></footer>

  <script type="module">
    import { renderNavigation, renderContact, renderFooter, handleAnchorLinks, initScrollAnimations } from './scripts.js';

    async function getContent(key, file) {
      if (window.__CONTENT__ && window.__CONTENT__[key]) return window.__CONTENT__[key];
      const res = await fetch(file);
      return res.json();
    }

    async function loadDetailedServices() {
      try {
        const navData = await getContent('navigation', 'content/navigation.json');
        renderNavigation(navData);

        const data = await getContent('services_detailed', 'content/services_detailed.json');

        document.getElementById('page-title').textContent = data.page_title;
        document.getElementById('page-intro').textContent = data.intro;

        const container = document.getElementById('services-detailed');
        container.innerHTML = data.services.map(service => `
        <section id="${service.id}" class="detailed-item section-white">
          <div class="detailed-grid">
            <div class="detailed-info">
              <h2>${service.title}</h2>
              <p>${service.full_description}</p>
              <ul class="feature-list">
                ${service.features.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>
          </div>
        </section>
      `).join('');

        const footerData = await getContent('footer', 'content/footer.json');
        renderFooter(footerData);

        const contactData = await getContent('contact', 'content/contact.json');
        renderContact(contactData);

        handleAnchorLinks();
        initScrollAnimations();

      } catch (error) {
        console.error('Error loading detailed services:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDetailedServices);
  </script>

</body>

</html>
